services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-job-assistant-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_job_assistant
    ports:
      # Host 5433 avoids conflicts with a local Postgres already on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_job_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-job-assistant-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_job_assistant
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      JOB_IMPORT_ENABLED: "true"
      WORKER_BATCH_SIZE: "10"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ai-job-assistant-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: ai-job-assistant-worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_job_assistant
      BACKEND_URL: http://backend:8000
      WORKER_POLL_INTERVAL_SECONDS: "30"
      WORKER_BATCH_SIZE: "10"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
